name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set package versions from tag
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" \
            GamersCommunity.Core/GamersCommunity.Core.csproj \
            GamersCommunity.Core.Logging/GamersCommunity.Core.Logging.csproj

      - name: Restore, build, pack
        run: |
          mkdir -p artifacts
          dotnet restore GamersCommunity.Core.sln
          dotnet build GamersCommunity.Core.sln -c Release --no-restore
          # GeneratePackageOnBuild can race with pack; pack from built outputs only
          dotnet pack GamersCommunity.Core/GamersCommunity.Core.csproj -c Release -o artifacts --no-build \
            -p:GeneratePackageOnBuild=false
          dotnet pack GamersCommunity.Core.Logging/GamersCommunity.Core.Logging.csproj -c Release -o artifacts --no-build \
            -p:GeneratePackageOnBuild=false

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/Bari77/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Core ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.nupkg
